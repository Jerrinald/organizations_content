version: "3.4"
services:
 vite_docker:
   image: node:alpine
   container_name: vite_docker
   entrypoint: /bin/sh
   ports:
     - 5173:5173
   working_dir: /srv/app
   command : -c "npm install && npm run dev"
   volumes:
     - type: bind
       source: ./
       target: /srv/app
     - node_modules:/srv/app/node_modules
   tty: true

volumes:
  node_modules: